<script>
document.addEventListener("DOMContentLoaded", function(){

let noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", function(){
    let x = Math.random() * 250;
    let y = Math.random() * 200;
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

window.showLove = function(){
    document.getElementById("page1").style.display="none";
    document.getElementById("page2").style.display="block";
    startSlide();
    createHearts();
    playMusic();
}

function startSlide(){
    let images=[
        "1.jpeg","2.jpeg","3.jpeg","4.jpeg","5.jpeg",
        "6.jpeg","7.jpeg","8.jpeg","9.jpeg"
    ];

    let slide=document.getElementById("slideshow");
    let i=0;

    setInterval(function(){
        i=(i+1)%images.length;
        slide.src=images[i];
    },2000);
}

function createHearts(){
    setInterval(function(){
        let heart=document.createElement("div");
        heart.innerHTML="❤️";
        heart.style.position="absolute";
        heart.style.left=Math.random()*100+"vw";
        heart.style.top="-20px";
        heart.style.fontSize=(Math.random()*20+15)+"px";
        document.body.appendChild(heart);

        let fall=setInterval(function(){
            heart.style.top=parseFloat(heart.style.top)+3+"px";
        },20);

        setTimeout(function(){
            clearInterval(fall);
            heart.remove();
        },4000);

    },300);
}

function playMusic(){
    let music=document.createElement("iframe");
    music.style.display="none";
    music.src="https://www.youtube.com/embed/SgSOAPwTOdc?autoplay=1&loop=1&playlist=SgSOAPwTOdc";
    music.allow="autoplay";
    document.body.appendChild(music);
}

});
</script>
