<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family: Arial, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    background:rgba(0,0,0,0.5);
    padding:25px;
    border-radius:20px;
    color:white;
    width:90%;
    max-width:400px;
    position:relative;
}

button{
    padding:10px 25px;
    margin:10px;
    border:none;
    border-radius:20px;
    font-size:16px;
    cursor:pointer;
}

#yes{
    background:#ff4d6d;
    color:white;
    position:relative;
    z-index:2;
}

#no{
    background:#555;
    color:white;
    position:relative;
}

@media (min-width: 600px){
    #no{
        position:absolute;
    }
}

img{
    width:100%;
    border-radius:15px;
    margin-top:15px;
}

.heart{
    position:absolute;
    color:red;
    font-size:20px;
    animation:fall 5s linear infinite;
}

@keyframes fall{
    0%{top:-10%; opacity:1;}
    100%{top:110%; opacity:0;}
}
</style>
</head>

<body>

<div class="container" id="page1">
    <h2>Apakah kamu sayang aku? 💕</h2>
    <button id="yes">YES</button>
    <button id="no">NO</button>
</div>

<div class="container" id="page2" style="display:none;">
    <h2>Hii MyDeww ❤️</h2>

    <p>
        Tuhan baik sekali mempertemukan aku dengan kamu.<br>
        Kamu bukan cuma bahagiaku,<br>
        tapi alasan aku ingin jadi pria yang lebih baik setiap hari.
    </p>

    <p style="font-style:italic;">
        "Lihatlah, cantik engkau, manisku."<br>
        – Kidung Agung 1:15
    </p>

    <img id="slideshow" src="1.jpeg">

    <audio id="bgm" loop>
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>

    <p style="margin-top:10px;">
        Dari anak Network yang ingin romantis ala ala programmer 🤍
    </p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

let yesBtn = document.getElementById("yes");
let noBtn = document.getElementById("no");

yesBtn.addEventListener("click", function(){

    document.getElementById("page1").style.display="none";
    document.getElementById("page2").style.display="block";

    startSlide();
    createHearts();

    let music = document.getElementById("bgm");
    music.play().catch(() => {
        console.log("Autoplay blocked");
    });
});

noBtn.addEventListener("mouseover", function(){
    if(window.innerWidth > 600){
        let x = Math.random() * 200;
        let y = Math.random() * 150;
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }
});

function startSlide(){
    let images=[
        "1.jpeg","2.jpeg","3.jpeg","4.jpeg","5.jpeg",
        "6.jpeg","7.jpeg","8.jpeg","9.jpeg"
    ];

    let slide=document.getElementById("slideshow");
    let i=0;

    setInterval(function(){
        i=(i+1)%images.length;
        slide.src=images[i];
    },2000);
}

function createHearts(){
    setInterval(function(){
        let heart=document.createElement("div");
        heart.innerHTML="❤️";
        heart.className="heart";
        heart.style.left=Math.random()*100+"vw";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),5000);
    },400);
}

});
</script>

</body>
</html>
